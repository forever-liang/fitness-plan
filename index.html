<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="减脂计划">
<meta name="theme-color" content="#0d1117">
<title>减脂饮食计划</title>
<style>
:root{
  --bg:#0d1117; --card:#161b22; --card2:#1b2230; --line:#252c38;
  --tx:#e6edf3; --dim:#8b949e; --dim2:#6e7681;
  --acc:#3fb950; --blue:#58a6ff; --orange:#f0883e; --pink:#db61a2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.5;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
}
header{
  position:sticky;top:0;z-index:20;
  background:rgba(13,17,23,.9);backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  padding:calc(8px + env(safe-area-inset-top)) 16px 10px;
  border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hd h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.2px}
.hd .sub{font-size:12px;color:var(--dim2);margin-top:2px}
.hd .right{text-align:right;font-size:12px;color:var(--dim);flex:0 0 auto}
.hd .right b{display:block;font-size:17px;color:var(--acc);font-weight:650}
main{padding:14px 14px 4px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card.flat{background:transparent;border-style:dashed;color:var(--dim);font-size:13px}
h2.sec{font-size:13px;color:var(--dim2);font-weight:600;letter-spacing:.6px;
  text-transform:uppercase;margin:18px 4px 8px}
.kcalbig{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:2px 0 8px}
.kcalbig span{font-size:14px;font-weight:400;color:var(--dim)}
.bar{height:8px;border-radius:6px;background:#20262f;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--acc);transition:width .25s ease}
.bar.b i{background:var(--blue)} .bar.p i{background:var(--pink)}
.mrow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin:12px 0 5px}
.mrow b{color:var(--tx);font-weight:600}
.meal{border:1px solid var(--line);border-radius:16px;background:var(--card);
  margin-bottom:10px;overflow:hidden}
.mhd{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;background:var(--card2)}
.mhd .t{font-weight:650;font-size:15px}
.mhd .n{font-size:11.5px;color:var(--dim2);font-weight:400;margin-top:1px}
.mhd .s{font-size:11.5px;color:var(--dim);text-align:right;white-space:nowrap}
.mhd .s b{color:var(--acc);font-weight:650}
.item{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;
  border-top:1px solid var(--line);cursor:pointer;user-select:none}
.item:active{background:#1a2130}
.box{width:22px;height:22px;flex:0 0 22px;border-radius:7px;border:1.6px solid #3a4453;
  margin-top:1px;display:flex;align-items:center;justify-content:center;
  font-size:14px;color:transparent;transition:all .15s}
.item.on .box{background:var(--acc);border-color:var(--acc);color:#0d1117}
.item.on .nm{color:var(--dim2);text-decoration:line-through}
.nm{flex:1;font-size:14.5px}
.mac{font-size:11px;color:var(--dim2);margin-top:3px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.d{color:var(--dim);white-space:nowrap;width:56px;font-size:13px}
button{font-family:inherit;font-size:14px;color:var(--tx);background:var(--card2);
  border:1px solid var(--line);border-radius:11px;padding:11px 14px;cursor:pointer}
button:active{opacity:.7}
button.pri{background:var(--acc);border-color:var(--acc);color:#0b1015;font-weight:650}
button.wide{width:100%;margin-top:4px}
button.sm{padding:6px 11px;font-size:12.5px}
.row2{display:flex;gap:8px}
.row2 input{flex:1;min-width:0}
input,textarea{font-family:inherit;font-size:16px;color:var(--tx);background:#0f141b;
  border:1px solid var(--line);border-radius:11px;padding:11px 12px;width:100%}
textarea{font-size:12px;font-family:ui-monospace,Menlo,monospace;min-height:110px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(13,17,23,.94);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;background:none;border:0;border-radius:0;padding:9px 2px 10px;
  color:var(--dim2);font-size:10.5px;display:flex;flex-direction:column;
  align-items:center;gap:3px}
nav button .ic{font-size:18px;line-height:1}
nav button.on{color:var(--acc)}
.dim{color:var(--dim)}
.warn{background:#2b1f10;border:1px solid #5a3a15;color:#f0b46e;
  border-radius:12px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
.danger{background:#2b1414;border:1px solid #5e2a2a;color:#f09c9c;
  border-radius:12px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600;font-variant-numeric:tabular-nums}
.wl{display:flex;justify-content:space-between;align-items:center;
  font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line)}
.wl:last-child{border-bottom:0}
svg{display:block;width:100%;height:auto}
ol,ul{padding-left:20px;margin:8px 0}
li{font-size:13.5px;color:var(--dim);margin:5px 0}
li b{color:var(--tx)}
/* 训练 */
.tday{border:1px solid var(--line);border-radius:16px;background:var(--card);
  margin-bottom:10px;overflow:hidden}
.tday.today{border-color:#2f6b3c;box-shadow:0 0 0 1px #2f6b3c inset}
.thd{display:flex;align-items:center;gap:11px;padding:13px 14px;background:var(--card2);cursor:pointer;user-select:none}
.thd .dt{font-weight:650;font-size:15px;flex:1;min-width:0}
.thd .dt .sm2{display:block;font-size:11.5px;color:var(--dim2);font-weight:400;margin-top:2px}
.thd .pn{font-size:11.5px;color:var(--dim);text-align:right;white-space:nowrap}
.thd .pn b{color:var(--acc);font-weight:650;display:block;font-size:13px}
.chev{color:var(--dim2);font-size:13px;flex:0 0 auto}
.tbody{display:none;border-top:1px solid var(--line)}
.tday.open .tbody{display:block}
.ex{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.ex:last-child{border-bottom:0}
.ex.on{background:#141b23}
.ex.on .box{background:var(--acc);border-color:var(--acc);color:#0d1117}
.exmain{flex:1;min-width:0}
.exname{font-size:14.5px;font-weight:600}
.ex.on .exname{color:var(--dim2);text-decoration:line-through}
.exmeta{font-size:11.5px;color:var(--blue);margin-top:3px;font-variant-numeric:tabular-nums}
.extip{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.45}
.exkg{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--dim2)}
.exkg input{width:88px;padding:7px 9px;font-size:14px;border-radius:9px}
.rest{font-size:11.5px;color:var(--dim2);margin-top:4px}
/* 采购 */
.money{display:flex;gap:8px;margin-bottom:4px}
.money > div{flex:1;background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.money .lb{font-size:11px;color:var(--dim2)}
.money .vv{font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.diff{text-align:center;font-size:12.5px;margin-top:9px;color:var(--dim)}
.diff b{font-size:15px}
.ok{color:var(--acc)} .over{color:var(--orange)}
details{margin-top:10px}
summary{cursor:pointer;color:var(--dim);font-size:13px;outline:none}
details p{font-size:13.5px;color:var(--dim);margin:8px 0}
code{font-family:ui-monospace,Menlo,monospace;color:#7ee2a8;font-size:11.5px;word-break:break-all}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div>
      <h1 id="title">减脂计划</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="right">
      <b id="pct">0%</b>
      <span id="pctlbl">今日完成</span>
    </div>
  </div>
</header>

<main id="view"></main>
<nav id="nav"></nav>

<script>
(function(){
"use strict";

/* ================== 数据（无冰箱 / 无蛋白粉 / 无金枪鱼罐头） ================== */
var PLAN = {

      {n:"蔬菜 400g（西兰花 / 青菜 / 蘑菇）", k:100, p:8, c:18, f:1},

  ],

  // 每天晚餐要买的东西（按星期索引）

    ["去皮鸡腿 220g","冷冻混合蔬菜 300g","糙米 200g"],                    // 日
    ["去皮鸡腿 220g","西兰花 300g","红薯 200g"],                          // 一
    ["鸡胸肉 200g","洋葱 1 个","糙米 200g"],                              // 二
    ["鸡蛋 3 个","豆干 150g","青菜 300g","玉米 1 根"],                     // 三
    ["北豆腐 300g","番茄 1 个","蘑菇 150g","荞麦面 80g"],                  // 四

  ],
  // 常温可囤，不需要冰箱，几天买一次
  shopStaple:[
    ["肉蛋",["鸡蛋（30 个装，常温阴凉可放 2–3 周）","水浸金枪鱼罐头（可选，线上买，常温存一年）"]],
    ["常温奶",["常温纯牛奶 250ml × 12（利乐包，不用冰箱）"]],
    ["豆制品",["真空包装豆干 100g × 5"]],
    ["主食",["燕麦 500g","糙米 / 红薯 / 玉米（红薯玉米可常温放一周）"]],
    ["坚果油脂",["原味无盐坚果 200g","橄榄油","油醋汁"]],
    ["调味",["黑胡椒","姜葱蒜","酱油"]],
    ["一次性",["厨房秤"]]
  ],
  // 训练：按星期索引 0=周日 … 6=周六
  train:[
    {d:"周日", t:"完全休息", s:"只保证步数", kind:"rest", ex:[
      {n:"散步 / 快走", eq:"无器械", sr:"30–45 分钟", tip:"目标 8000–10000 步。骑电动车等于没有日常步数，这是你最容易被忽略的漏洞。饭后走 20 分钟最容易做到。", rest:"—"}
    ]},
    {d:"周一", t:"上肢推 · 胸 / 肩 / 三头", s:"60–75 分钟 + 爬坡 15 分钟", kind:"push", ex:[

      {n:"上斜哑铃卧推", eq:"哑铃 + 可调靠背凳", sr:"3 组 × 10–12 次", tip:"靠背调到 30–45°，两肘不要完全打开，哑铃下放到胸口两侧，用胸肌把哑铃推起、顶端不要碰在一起。", rest:"休息 75 秒"},
      {n:"蝴蝶机夹胸", eq:"蝴蝶机 / 龙门架", sr:"3 组 × 12–15 次", tip:"手肘保持微屈且角度全程不变，用大臂往中间夹，顶端停 1 秒再慢放。不要用手掌发力。", rest:"休息 60 秒"},
      {n:"坐姿肩推机", eq:"肩推机 / 哑铃", sr:"3 组 × 10–12 次", tip:"核心收紧、腰不要过度后仰，推到头顶正上方，下放到耳朵高度即可，不要砸到底。", rest:"休息 75 秒"},
      {n:"哑铃侧平举", eq:"哑铃", sr:"3 组 × 12–15 次", tip:"小重量。肘略高于手腕，抬到与肩同高就停，全程不甩不借力。这是最容易做错的动作，宁可减重量。", rest:"休息 60 秒"},
      {n:"绳索下压（三头）", eq:"龙门架 + 直杆 / 绳索", sr:"3 组 × 12–15 次", tip:"大臂夹紧身体不动，只有小臂在动，底端完全伸直停 1 秒，回放时不要让重量把手臂拉上去。", rest:"休息 60 秒"},
      {n:"爬坡走", eq:"跑步机", sr:"15 分钟", tip:"坡度 8–12%，速度 4–5.5 km/h，不要扶扶手（扶了消耗会掉三成）。", rest:"训练结束后做"}
    ]},
    {d:"周二", t:"下肢 · 腿 / 臀", s:"60–75 分钟 + 爬坡 10 分钟", kind:"legs", ex:[

      {n:"哈克深蹲（或史密斯深蹲）", eq:"哈克机 / 史密斯架", sr:"3 组 × 10–12 次", tip:"下蹲到大腿平行地面，膝盖始终对准脚尖方向、不要内扣。你用器械代替自由杠铃深蹲，是为了保护腰。", rest:"休息 90 秒"},
      {n:"坐姿腿屈伸", eq:"腿屈伸机", sr:"3 组 × 12–15 次", tip:"背贴靠背，顶端伸直停 1 秒再慢慢放下，不要靠甩腿完成。", rest:"休息 60 秒"},

      {n:"臀推机（或哑铃罗马尼亚硬拉）", eq:"臀推机 / 哑铃", sr:"3 组 × 10–12 次", tip:"臀推：下巴微收，靠臀发力顶起，不要用腰。罗马尼亚硬拉：背全程挺直，屈髋把哑铃下放到小腿中段。", rest:"休息 75 秒"},

      {n:"爬坡走", eq:"跑步机", sr:"10 分钟", tip:"腿练完之后做，坡度 6–10% 即可，当作放松。", rest:"训练结束后做"}
    ]},
    {d:"周三", t:"休息 或 纯有氧", s:"30–40 分钟爬坡 + 拉伸", kind:"cardio", ex:[

      {n:"全身拉伸", eq:"垫子", sr:"10 分钟", tip:"重点拉胸、背、髋、大腿前后侧，每个部位 30 秒，不要弹震。", rest:"—"}
    ]},
    {d:"周四", t:"上肢拉 · 背 / 二头", s:"60–75 分钟 + 爬坡 15 分钟", kind:"pull", ex:[

/* ================== 存储 ================== */
var KEY = "fitness-plan-v2";
var memOnly = false;

function pad(n){ return n < 10 ? "0"+n : ""+n; }
function fmtDate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayStr(){ return fmtDate(new Date()); }
function monthStr(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
var WD = ["周日","周一","周二","周三","周四","周五","周六"];

function blank(){
  return {ver:2, day:todayStr(), checks:{}, dshop:{}, pshop:{},
          weights:[], tdone:{}, tkg:{}, open:{}, budget:50, spend:{}, tab:"today"};
}
var S = blank();

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var o = JSON.parse(raw);
      for(var k in o){ if(Object.prototype.hasOwnProperty.call(o,k)) S[k] = o[k]; }
    }
  }catch(e){ memOnly = true; }
  if(!S.day) S.day = todayStr();
  if(S.day !== todayStr()){ S.day = todayStr(); S.checks = {}; S.dshop = {}; }
  if(!Array.isArray(S.weights)) S.weights = [];
  if(!S.shop) S.shop = {};
  if(!S.pshop) S.pshop = {};
  if(!S.dshop) S.dshop = {};
  if(!S.checks) S.checks = {};
  if(!S.tdone) S.tdone = {};
  if(!S.tkg) S.tkg = {};
  if(!S.open) S.open = {};
  if(!S.spend) S.spend = {};
  if(typeof S.budget !== "number") S.budget = 50;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ memOnly = true; }
}

/* ================== 计算 ================== */
function mealStats(mi){
  var m = PLAN.meals[mi], t = {k:0,p:0,c:0,f:0}, done = 0;
  for(var i=0;i<m.items.length;i++){
    if(S.checks[mi+"-"+i]){
      done++;
      t.k += m.items[i].k; t.p += m.items[i].p;
      t.c += m.items[i].c; t.f += m.items[i].f;
    }
  }
  t.done = done; t.total = m.items.length;
  return t;
}
function dayStats(){
  var t = {k:0,p:0,c:0,f:0,done:0,total:0};
  for(var i=0;i<PLAN.meals.length;i++){
    var s = mealStats(i);
    t.k += s.k; t.p += s.p; t.c += s.c; t.f += s.f;
    t.done += s.done; t.total += s.total;
  }
  return t;
}
function trainStats(wi){
  var t = PLAN.train[wi], done = 0;
  for(var i=0;i<t.ex.length;i++) if(S.tdone["t"+wi+"_"+i]) done++;
  return {done:done, total:t.ex.length};
}
function monthSpend(){
  var m = monthStr(), sum = 0, days = 0;
  for(var k in S.spend){
    if(k.indexOf(m) === 0 && typeof S.spend[k] === "number"){ sum += S.spend[k]; days++; }
  }
  return {sum:sum, days:days, budget:days * S.budget};
}
function r(n){ return Math.round(n); }
function pct(a,b){ return Math.max(0, Math.min(100, Math.round(a / b * 100))); }
function money(n){ return (Math.round(n*100)/100).toFixed(2).replace(/\.00$/,''); }

/* ================== 今日 ================== */

  }
  h += '<div class="card">';

  h += '<div class="kcalbig">'+r(d.k)+' <span>/ '+T.kcal+' kcal</span></div>';
  h += '<div class="bar"><i style="width:'+pct(d.k,T.kcal)+'%"></i></div>';
  h += bar("蛋白","g",d.p,T.p,"b");
  h += bar("碳水","g",d.c,T.c,"");
  h += bar("脂肪","g",d.f,T.f,"p");

     + Math.max(0,r(T.p-d.p))+' g ｜ 已勾选 '+d.done+'/'+d.total+' 项</div>';
  h += '<div class="card flat">🍽 今天'+WD[wi]+'的晚餐：'+PLAN.dinner[wi]+'</div>';

  for(var i=0;i<PLAN.meals.length;i++){

    h += '<div class="meal">';
    h += '<div class="mhd"><div><div class="t">'+m.name+'</div><div class="n">'+m.note+'</div></div>'
       + '<div class="s">'+r(s.k)+' kcal<br>蛋白 <b>'+r(s.p)+'g</b></div></div>';
    for(var j=0;j<m.items.length;j++){
      var it = m.items[j], id = i+"-"+j, on = !!S.checks[id];
      h += '<div class="item'+(on?" on":"")+'" data-chk="'+id+'">'
         + '<div class="box">✓</div><div class="nm">'+it.n
         + '<div class="mac">'+r(it.k)+' kcal ｜ 蛋白 '+it.p+'g ｜ 碳 '+it.c+'g ｜ 脂 '+it.f+'g</div>'
         + '</div></div>';
    }
    h += '</div>';
  }
  h += '<button class="wide" data-act="clear">清空今日勾选</button>';
  return h;
}
function bar(label, unit, val, goal, cls){
  return '<div class="mrow"><span>'+label+'</span><span><b>'+r(val)+'</b> / '+goal+unit+'</span></div>'
       + '<div class="bar '+cls+'"><i style="width:'+pct(val,goal)+'%"></i></div>';
}

       + '<div class="kv"><span>累计变化（'+S.weights.length+' 次记录）</span><b>'
       + (last-first>=0?"+":"")+(last-first).toFixed(1)+' kg</b></div></div>';
    h += '<h2 class="sec">全部记录</h2><div class="card">';
    for(var j=S.weights.length-1;j>=0;j--){
      h += '<div class="wl"><span class="dim">'+S.weights[j].d+'</span><span>'
         + '<b>'+S.weights[j].w.toFixed(1)+' kg</b> '
         + '<button class="sm" data-act="delw" data-i="'+j+'" style="margin-left:8px">删</button></span></div>';
    }
    h += '</div>';
  }
  h += '<div class="card flat">连续 2–3 周平均值不掉，再把每天热量砍 150–200 kcal 或者加步数，不要一上来就砍到 1500。</div>';
  return h;
}
function chart(){
  var ws = S.weights;
  if(ws.length < 2) return '<p class="dim" style="margin:0;font-size:13.5px">记录 2 次以上就能看到趋势线。</p>';
  ws = ws.slice(-14);
  var vals = [], i;
  for(i=0;i<ws.length;i++) vals.push(ws[i].w);
  var mn = Math.min.apply(null,vals), mx = Math.max.apply(null,vals);
  var span = Math.max(mx-mn, 0.8), W = 320, H = 130, padx = 14, pady = 16;
  var pts = [];
  for(i=0;i<ws.length;i++){
    var x = padx + (W-2*padx) * (i/(ws.length-1));
    var y = pady + (H-2*pady) * (1-(ws[i].w-mn)/span);
    pts.push([x,y]);
  }
  var poly = "";
  for(i=0;i<pts.length;i++) poly += pts[i][0].toFixed(1)+","+pts[i][1].toFixed(1)+" ";
  var area = poly + pts[pts.length-1][0].toFixed(1)+","+(H-2)+" "+pts[0][0].toFixed(1)+","+(H-2);
  var dots = "";
  for(i=0;i<pts.length;i++) dots += '<circle cx="'+pts[i][0].toFixed(1)+'" cy="'+pts[i][1].toFixed(1)+'" r="3" fill="#3fb950"/>';
  return '<div class="mrow" style="margin-top:0"><span>最高 '+mx.toFixed(1)+' kg</span>'
       + '<span>最低 '+mn.toFixed(1)+' kg</span></div>'
       + '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:130px">'
       + '<polygon points="'+area+'" fill="#3fb950" opacity="0.10"/>'
       + '<polyline points="'+poly+'" fill="none" stroke="#3fb950" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
       + dots + '</svg>'
       + '<div class="mrow"><span class="dim">'+ws[0].d+'</span>'
       + '<span class="dim">'+ws[ws.length-1].d+'</span></div>';
}

var VIEWS = {today:viewToday, menu:viewMenu, shop:viewShop, train:viewTrain, weight:viewWeight, info:viewInfo};
var LBL = {today:"今日完成", menu:"", shop:"今日采购", train:"今日训练", weight:"", info:""};

/* ================== 渲染 ================== */
function renderNav(){
  var h = "";
  for(var i=0;i<TABS.length;i++){
    h += '<button data-tab="'+TABS[i][0]+'" class="'+(S.tab===TABS[i][0]?"on":"")+'">'
       + '<span class="ic">'+TABS[i][2]+'</span>'+TABS[i][1]+'</button>';
  }
  document.getElementById("nav").innerHTML = h;
}
function render(){
  var tabChanged = (render.lastTab !== S.tab);
  document.getElementById("view").innerHTML = VIEWS[S.tab]();
  var d = dayStats(), dt = new Date(), wi = dt.getDay();
  var right = document.getElementById("pct"), lbl = document.getElementById("pctlbl");
  if(S.tab === "train"){
    var ts = trainStats(wi);
    right.textContent = pct(ts.done, ts.total) + "%";
    lbl.textContent = "今日训练";
    right.style.color = "#58a6ff";
  }else if(S.tab === "shop"){
    var sp = S.spend[todayStr()];
    right.textContent = (typeof sp === "number") ? money(sp) : "—";
    lbl.textContent = "今日花费 元";
    right.style.color = "#f0883e";
  }else{
    right.textContent = pct(d.k, PLAN.target.kcal) + "%";
    lbl.textContent = "今日完成";
    right.style.color = "#3fb950";
  }
  document.getElementById("sub").textContent = S.day + " " + WD[wi]
    + " ｜ 饮食 " + d.done + "/" + d.total
    + " ｜ 训练 " + trainStats(wi).done + "/" + trainStats(wi).total;
  renderNav();
  if(tabChanged) window.scrollTo(0, 0);
  render.lastTab = S.tab;
}

/* ================== 交互 ================== */
document.getElementById("nav").addEventListener("click", function(e){
  var b = e.target.closest("button[data-tab]");
  if(!b) return;
  S.tab = b.getAttribute("data-tab");
  save(); render();
});

document.getElementById("view").addEventListener("click", function(e){
  if(e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;

  // 展开 / 收起训练日
  var tg = e.target.closest("[data-toggle]");
  if(tg){
    var di = tg.getAttribute("data-toggle"), k = "o"+di;
    if(S.open[k]) delete S.open[k]; else S.open[k] = 1;
    save(); render(); return;
  }
  // 训练动作打勾
  var ex = e.target.closest("[data-ex]");
  if(ex){
    var ek = ex.getAttribute("data-ex");
    if(S.tdone[ek]) delete S.tdone[ek]; else S.tdone[ek] = 1;
    save(); render(); return;
  }
  // 饮食 / 购物勾选
  var it = e.target.closest(".item");
  if(it){
    if(it.hasAttribute("data-chk")){
      var id = it.getAttribute("data-chk");
      if(S.checks[id]) delete S.checks[id]; else S.checks[id] = 1;
      save(); render(); return;
    }
    if(it.hasAttribute("data-dshop")){
      var did = it.getAttribute("data-dshop");
      if(S.dshop[did]) delete S.dshop[did]; else S.dshop[did] = 1;
      save(); render(); return;
    }
    if(it.hasAttribute("data-pshop")){
      var pid = it.getAttribute("data-pshop");
      if(S.pshop[pid]) delete S.pshop[pid]; else S.pshop[pid] = 1;
      save(); render(); return;
    }
  }
  var btn = e.target.closest("button[data-act]");
  if(!btn) return;
  var act = btn.getAttribute("data-act");
  if(act === "clear"){ S.checks = {}; save(); render(); }
  else if(act === "cleardshop"){ S.dshop = {}; save(); render(); }
  else if(act === "clearpshop"){ S.pshop = {}; save(); render(); }
  else if(act === "setbudget"){
    var bv = parseFloat(document.getElementById("bi").value);
    if(isNaN(bv) || bv <= 0 || bv > 5000){ alert("请输入合理的每日预算（0–5000）"); return; }
    S.budget = Math.round(bv*100)/100; save(); render();
  }
  else if(act === "setspend"){
    var sv = parseFloat(document.getElementById("si").value);
    if(isNaN(sv) || sv < 0 || sv > 5000){ alert("请输入今天实际花了多少（0–5000）"); return; }
    S.spend[todayStr()] = Math.round(sv*100)/100; save(); render();
  }
  else if(act === "delspend"){
    delete S.spend[btn.getAttribute("data-k")]; save(); render();
  }
  else if(act === "addw"){
    var el = document.getElementById("wi"), v = parseFloat(el && el.value);
    if(isNaN(v) || v < 30 || v > 300){ alert("请输入 30–300 之间的体重"); return; }
    S.weights.push({d:todayStr(), w:Math.round(v*10)/10});
    save(); render();
  }
  else if(act === "delw"){
    S.weights.splice(parseInt(btn.getAttribute("data-i"),10),1); save(); render();
  }
  else if(act === "exp"){
    var txt = document.getElementById("io");
    txt.value = JSON.stringify({v:2, checks:S.checks, dshop:S.dshop, pshop:S.pshop,
      tdone:S.tdone, tkg:S.tkg, weights:S.weights, budget:S.budget, spend:S.spend});
    txt.select();
    alert("已生成。长按文本框全选 → 拷贝，粘到备忘录保存。");
  }
  else if(act === "imp"){
    try{
      var o = JSON.parse(document.getElementById("io").value);
      ["checks","dshop","pshop","tdone","tkg","spend"].forEach(function(k){ if(o[k]) S[k] = o[k]; });
      if(o.weights) S.weights = o.weights;
      if(typeof o.budget === "number") S.budget = o.budget;
      save(); render(); alert("导入成功");
    }catch(err){ alert("内容格式不对，请重新粘贴"); }
  }
});

// 训练重量输入
document.getElementById("view").addEventListener("input", function(e){
  var t = e.target;
  if(t && t.hasAttribute && t.hasAttribute("data-kg")){
    S.tkg[t.getAttribute("data-kg")] = t.value;
    save();
  }
});

load();
render();
})();
